name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build dependency ScappiCore
        run: |
          git clone --depth 1 https://github.com/ScappiDoo/ScappiCore dep-ScappiCore
          mvn -q -f dep-ScappiCore/pom.xml install -DskipTests

      - name: Build
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ScappiWatch
          path: target/ScappiWatch.jar

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ScappiWatch.jar
          generate_release_notes: true
